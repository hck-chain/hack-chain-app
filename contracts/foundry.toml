[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Fijada a proposito: sin esto el compilador usa la ultima version que soporta solc,
# y el bytecode deja de ser reproducible para el auditor y para la verificacion
# del codigo fuente en el explorador de bloques.
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[etherscan]
polygon = { key = "${POLYGON_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
